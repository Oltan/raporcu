# Test projesinin .gitlab-ci.yml dosyası (divan ile).
#
# İki yol var:
#   A) divan deposu şirket GitLab'ında ise: aşağıdaki include (şablon güncellenince
#      tüm test projeleri kendiliğinden yeni şablonu kullanır).
#   B) Değilse: divan'daki ci/gitlab/template/.gitlab-ci.yml dosyasını olduğu gibi bu
#      dosyanın yerine kopyalayın (tek başına çalışır) ve aşağıdaki variables'ı onun
#      variables bölümüne ekleyin.
#
# Aşamalar: test → report → fix. Fix, testler bitince otomatik çalışır (ULAK_FIX=off ile kapanır).

include:
  - project: 'ekip/divan'          # divan deposunun GitLab yolu
    ref: main
    file: '/ci/gitlab/template/.gitlab-ci.yml'

variables:
  ULAK_OS: linux                      # bu projenin runner'ı: linux ya da windows
  # ULAK_SERVER: "http://127.0.0.1:8080"   # divan runner'la aynı makinede (varsayılan)
  # ULAK_TAGS: "@smoke"                     # boşsa features.txt kullanılır
  # ULAK_FIX: "off"                         # self-healing yalnızca gece koşsun istiyorsanız:
  #                                         #   burada "off", gece schedule'ında ULAK_FIX=on
  # ULAK_FIX_AGENT: "opencode"              # ya da "claude"
  # ULAK_FIX_MAX: "3"                       # koşum başına en fazla düzeltilecek senaryo
  #
  # Proje > Settings > CI/CD > Variables (masked):
  #   CI_API_TOKEN    divan .env'deki ile aynı
  #   ULAK_FIX_TOKEN  proje erişim tokenı (api + write_repository): auto-fix branch + MR
