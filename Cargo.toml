[workspace]
resolver = "2"
members = ["crates/common", "crates/raporcu", "crates/stajci", "crates/rehearse", "crates/e2esmoke"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
