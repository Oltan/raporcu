<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}divan{% endblock %} · divan</title>
<link rel="stylesheet" href="/static/app.css?v=4">
<script src="/static/htmx.min.js" defer></script>
</head>
<body>
<header class="ust">
  {% if l.share.is_some() %}
  {% block paylasim_ust %}<span class="logo">divan</span><span class="alt">Salt okunur paylaşım</span>{% endblock %}
  {% else %}
  <a class="logo" href="/">divan</a>
  <nav>
    <a href="/">Dashboard</a>
    <a href="/canli">Canlı</a>
    <a href="/search">Arama</a>
    <a href="/healing">Self-healing</a>
    <a href="/admin">Admin</a>
  </nav>
  <div class="sag">
    {% if l.admin %}<span>admin</span><form method="post" action="/logout" class="cikis"><button>Çıkış</button></form>
    {% else %}<a href="/login">Giriş</a>{% endif %}
  </div>
  {% endif %}
</header>
{% if let Some(b) = l.banner %}<div class="banner">{{ b }}</div>{% endif %}
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
