[package]
name = "raporcu"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
argon2 = { version = "0.5", features = ["std"] }
askama = "0.16.1"
axum = { version = "0.8.9", features = ["ws", "macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
common = { version = "0.1.0", path = "../common" }
dotenvy = "0.15.7"
fs4 = "1.1.0"
futures-util = "0.3.34"
hex = "0.4.3"
mime_guess = "2.0.5"
rpassword = "7.5.4"
rusqlite = { version = "0.41.1", features = ["bundled"] }
rust-embed = { version = "8.13.0", features = ["debug-embed"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "limit"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "registry"] }
ureq = { version = "3.5.0", features = ["json"] }
urlencoding = "2.1.3"
uuid = { version = "1.29.0", features = ["v4"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
axum = { version = "0.8.9", features = ["ws", "macros"] }
http-body-util = "0.1.5"
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
tokio-util = { version = "0.7.20", features = ["io"] }
tower = { version = "0.5.3", features = ["util"] }
urlencoding = "2.1.3"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
