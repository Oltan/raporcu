{% extends "base.html" %}
{% block title %}Admin girişi{% endblock %}
{% block content %}
<section class="kart dar">
  <h1>Admin girişi</h1>
  {% if let Some(e) = error %}<p class="hata">{{ e }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Şifre <input type="password" name="password" autofocus required></label>
    <button type="submit">Giriş</button>
  </form>
</section>
{% endblock %}
